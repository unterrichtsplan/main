<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unterrichtsmaterial</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Material">
<style>
:root{
  --page:#F4F6FA; --sheet:#FFFFFF; --ink:#1B2333; --muted:#5E6A7C; --line:#DFE4EC; --soft:#EEF2F7;
  --primary:#2F5FB3; --danger:#B42318; --ok:#177A5E; --lk:#7A5AF8; --lk-soft:#F1ECFE;
  --serif:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,30,50,.05),0 4px 14px rgba(20,30,50,.05);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0F141C; --sheet:#171E29; --ink:#E7ECF3; --muted:#A1ACBB; --line:#2A3443; --soft:#1F2733;
    --primary:#8DB2F2; --danger:#F08A80; --ok:#5FCB9F; --lk:#B4A0FF; --lk-soft:#2A2442;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0F141C; --sheet:#171E29; --ink:#E7ECF3; --muted:#A1ACBB; --line:#2A3443; --soft:#1F2733;
  --primary:#8DB2F2; --danger:#F08A80; --ok:#5FCB9F; --lk:#B4A0FF; --lk-soft:#2A2442;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
.acc-blau{--acc:#2F5FB3;--acc-soft:#E7EEFB}
.acc-gruen{--acc:#137A5C;--acc-soft:#E1F3EC}
.acc-orange{--acc:#C2410C;--acc-soft:#FCECDF}
.acc-lila{--acc:#6D4AB0;--acc-soft:#EFE9F9}
.acc-rot{--acc:#B42318;--acc-soft:#FBE8E6}
.acc-grau{--acc:#4B5563;--acc-soft:#ECEEF2}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .acc-blau{--acc:#8DB2F2;--acc-soft:#1E2B42}
  :root:not([data-theme="light"]) .acc-gruen{--acc:#5FCB9F;--acc-soft:#15302A}
  :root:not([data-theme="light"]) .acc-orange{--acc:#F4A06B;--acc-soft:#3A2517}
  :root:not([data-theme="light"]) .acc-lila{--acc:#B8A0EC;--acc-soft:#2A2240}
  :root:not([data-theme="light"]) .acc-rot{--acc:#F08A80;--acc-soft:#3A1C1A}
  :root:not([data-theme="light"]) .acc-grau{--acc:#B3BCC8;--acc-soft:#262E39}
}
.t-ab{--tc:#2F5FB3}.t-html{--tc:#0E7C7B}.t-praesentation{--tc:#C2410C}.t-dokument{--tc:#5E6A7C}
.t-mitschrift{--tc:#6D4AB0}.t-video{--tc:#C0265E}.t-link{--tc:#3F5A78}.t-loesung{--tc:#137A5C}.t-pruefung{--tc:#B42318}.t-buch{--tc:#8A5A12}.t-uebersicht{--tc:var(--acc)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .t-ab{--tc:#8DB2F2}
  :root:not([data-theme="light"]) .t-html{--tc:#5ED0CE}
  :root:not([data-theme="light"]) .t-praesentation{--tc:#F4A06B}
  :root:not([data-theme="light"]) .t-dokument{--tc:#B3BCC8}
  :root:not([data-theme="light"]) .t-mitschrift{--tc:#B8A0EC}
  :root:not([data-theme="light"]) .t-video{--tc:#F07FA8}
  :root:not([data-theme="light"]) .t-link{--tc:#9DB7D6}
  :root:not([data-theme="light"]) .t-loesung{--tc:#5FCB9F}
  :root:not([data-theme="light"]) .t-pruefung{--tc:#F08A80}
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0}
.muted{color:var(--muted)}
[hidden]{display:none !important}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--sheet) 90%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:.5rem 1rem;display:flex;align-items:center;gap:.5rem}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none;font-weight:700;margin-right:auto;min-height:44px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.05rem}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.pillbtn{display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:.45rem .9rem;min-height:42px;cursor:pointer;font-weight:600;white-space:nowrap}
.pillbtn.dark{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.pillbtn.add{background:var(--primary);color:#fff;border-color:var(--primary)}
/* iPad: Teilen im Viewer deutlich (nicht mit Safari-Teilen verwechseln) */
.pillbtn.teilen{background:var(--primary);color:#fff;border-color:var(--primary)}
.admin-only{display:none !important}
.can-edit .admin-only{display:inline-flex !important}
@media (max-width:560px){.pillbtn .lbl{display:none}.pillbtn{padding:.45rem .65rem}.pillbtn.teilen .lbl{display:inline}}

main{max-width:1040px;margin:0 auto;padding:1.2rem 1rem 4rem}

/* Start */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:1.6rem 1.5rem 1.5rem;margin:.4rem 0 1.4rem;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(111,168,255,.28),transparent 70%)}
.hero::after{content:"";position:absolute;right:120px;bottom:-110px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(60,196,160,.22),transparent 70%)}
.hero h1{font-size:clamp(1.9rem,4.6vw,2.6rem);position:relative}
.hero p{margin:.35rem 0 0;color:var(--muted);position:relative}
.hero .tools{position:absolute;right:.6rem;top:.6rem}
.faecher{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:1rem}
.fach{background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:1.2rem;box-shadow:var(--shadow)}
.fach-head{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem}
.fach-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);flex:none}
.fach-icon .i{width:26px;height:26px}
.fach-head h2{font-size:1.6rem;margin-right:auto}
.jgs{display:flex;flex-wrap:wrap;gap:.6rem}
.jg{display:grid;place-items:center;min-width:70px;height:70px;padding:0 .9rem;border-radius:16px;text-decoration:none;background:var(--acc-soft);color:var(--acc);
  font-family:var(--serif);font-size:1.75rem;font-weight:700;border:2px solid transparent;transition:transform .12s}
.jg:hover,.jg:focus-visible{border-color:var(--acc);outline:none;transform:translateY(-1px)}
.jg.add{background:transparent;border:2px dashed var(--line);color:var(--muted);cursor:pointer;font-family:var(--sans);font-size:1.3rem}

/* Kopfzeilen der Unterseiten */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem;color:var(--muted);font-size:.95rem;margin-bottom:.3rem}
.crumbs a{text-decoration:none;display:inline-flex;align-items:center;min-height:36px;padding:0 .2rem;border-radius:8px}
.crumbs a:hover{color:var(--ink)}
.page-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:0 0 1.3rem}
.page-head h1{font-size:clamp(1.8rem,4.4vw,2.4rem)}
.page-head .sub{flex-basis:100%;color:var(--muted);margin-top:-.2rem}
.pill{display:inline-flex;align-items:center;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:.95rem;padding:.25rem .8rem;font-family:var(--sans)}
.spacer{margin-left:auto}

/* Reihen-Übersicht */
.reihen{display:grid;gap:.75rem}
.reihe-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem;background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:1rem 1.1rem;text-decoration:none;box-shadow:var(--shadow)}
a.reihe-card:hover{border-color:var(--acc)}
.reihe-nr{font-family:var(--serif);font-size:2rem;font-weight:700;color:var(--acc);min-width:2.2rem;text-align:center}
.reihe-card b{display:block;font-size:1.15rem}
.reihe-card small{display:block;color:var(--muted)}
.reihe-card .go{color:var(--muted)}

/* Reihe */
.overview{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;background:var(--acc-soft);border-radius:16px;padding:.85rem 1rem;margin:0 0 1.2rem}
.overview b{color:var(--acc);margin-right:auto}
.rows{background:var(--sheet);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:auto minmax(130px,26%) 1fr auto;gap:.5rem 1rem;align-items:start;padding:1rem 1.1rem;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.nr{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:.98rem;margin-top:.15rem}
.row-title{padding-top:.25rem}
.row-title b{display:block;font-size:1.08rem;line-height:1.3}
.row-title small{display:block;color:var(--muted);font-size:.92rem}
.row-main{min-width:0}
.row.empty{display:block;color:var(--muted)}
@media (max-width:700px){
  .row{grid-template-columns:auto 1fr auto}
  .row .row-main{grid-column:2 / -1;grid-row:2}
}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{display:inline-flex;align-items:center;gap:.45rem;padding:.45rem .75rem;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);
  text-decoration:none;color:var(--ink);font-size:.98rem;cursor:pointer;text-align:left;max-width:100%}
.chip .i{color:var(--tc)}
.chip:hover,.chip:focus-visible{border-color:var(--tc);outline:none;background:color-mix(in srgb,var(--tc) 7%,var(--sheet))}
.chip .ext{font-size:.72rem;font-weight:700;letter-spacing:.03em;color:var(--muted);border-left:1px solid var(--line);padding-left:.45rem}
.chip.add{border-style:dashed;color:var(--muted)}
/* Trenner für mehrere Tage innerhalb eines Vorhabens (material.typ "tag") */
.trenner{flex-basis:100%;display:flex;align-items:center;gap:.6rem;margin:.3rem 0 0;padding:0;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.82rem;font-weight:700;letter-spacing:.02em;text-align:left;min-height:22px}
.trenner::after{content:"";flex:1;border-top:1px solid var(--line)}
button.trenner{min-height:36px;cursor:pointer}
button.trenner:hover span,button.trenner:focus-visible span{color:var(--acc);outline:none}
.editing [data-sort=m] > .trenner{cursor:grab}
.chip.still{cursor:default}.chip.still:hover{border-color:var(--line);background:var(--sheet)}
.chip .mehr{color:var(--tc);border-left-color:color-mix(in srgb,var(--tc) 35%,var(--line))}
.buch-text{font-size:1.1rem;line-height:1.5;margin:0 0 1rem}
.fmt ul{margin:.2rem 0 .2rem 1.2rem;padding:0}.fmt li{margin:.1rem 0}.fmt a{color:inherit;text-decoration:underline}
.chip.lkchip{border-style:dashed;border-color:color-mix(in srgb,var(--lk) 45%,var(--line))}
.lk-toggle{display:inline-flex;align-items:center;gap:.35rem;margin-top:.55rem;border:0;background:transparent;color:var(--lk);font-weight:600;font-size:.92rem;cursor:pointer;padding:.3rem .1rem;min-height:36px}
.lk-toggle .i{transition:transform .2s}
.lk-toggle[aria-expanded="true"] .i{transform:rotate(90deg)}
.lk-area{margin-top:.4rem;padding:.65rem;border-radius:12px;background:var(--lk-soft)}
.lk-area .lbl{display:block;font-size:.8rem;font-weight:700;color:var(--lk);text-transform:none;margin-bottom:.4rem}
.chip .niv{font-size:.8rem;letter-spacing:-.08em;color:#B7791F;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}
.tabs a{display:inline-flex;align-items:center;gap:.35rem;min-height:42px;padding:.35rem .9rem;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}
.tabs a.on{background:var(--primary);border-color:var(--primary);color:#fff}
.info-list details{border-top:1px solid var(--line);padding:.55rem 0}
.info-list details:first-child{border-top:0}
.info-list summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.info-list p{margin:.35rem 0 .2rem;color:var(--muted)}
.info-list dl{margin:.3rem 0 .3rem}
.info-list dt{font-weight:600;margin:.65rem 0 .1rem;font-size:.95rem}
.info-list dd{margin:0;color:var(--muted)}
.lk-notizen{display:grid;gap:.5rem;margin-bottom:.6rem}
.lk-notizen div{background:var(--sheet);border-radius:10px;padding:.5rem .7rem}
.lk-notizen > div > b{display:block;font-size:.8rem;color:var(--lk)}
.lk-notizen p{margin:0;font-size:.95rem}
.reihe-nav{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1.4rem}
.reihe-nav a{display:block;text-decoration:none;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:.75rem 1rem;min-height:60px}
.reihe-nav a:hover{border-color:var(--acc)}
.reihe-nav small{display:block;color:var(--muted);font-size:.85rem}
.reihe-nav b{color:var(--acc)}
.reihe-nav .next{text-align:right;grid-column:2}

/* Bearbeiten */
.tools{display:none;gap:.05rem;align-items:center}
.editing .tools{display:inline-flex}
.tools .iconbtn{width:40px;height:40px}
.tools .iconbtn.del:hover{color:var(--danger)}
/* Verschieben per Ziehen (Griff bei Fach/Reihe/Vorhaben, Material-Chip direkt; am iPad kurz gedrückt halten) */
.iconbtn.grip{cursor:grab;touch-action:none}
.editing [data-sort=m] > [data-sort-item]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.editing [data-sort=m] > .chip[data-sort-item]{cursor:grab}
.mwrap .iconbtn.pen{width:36px;height:36px;color:var(--muted)}
.mwrap .iconbtn.pen:hover{color:inherit}
body.sorting,body.sorting *{cursor:grabbing !important;-webkit-user-select:none;user-select:none}
.dragging{position:relative;z-index:20;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.22);border-radius:14px;background:var(--sheet);opacity:.96;transition:none !important}
.rows:has(.dragging){overflow:visible}
.row.dragging{outline:2px solid var(--acc,#2563eb)}
.drag-wait{transform:scale(.97);transition:transform .3s}
body.sorting [data-sort=m]{outline:1px dashed color-mix(in srgb,var(--muted) 40%,transparent);outline-offset:3px;border-radius:10px;min-height:42px}
body.sorting [data-sort=m].drop-ziel{outline:2px solid var(--acc,#2563eb)}
.edit-only{display:none !important}
.editing .edit-only{display:inline-flex !important}
.editing .rows,.editing .fach,.editing .reihe-card{border-style:dashed}
.addbtn{display:inline-flex;align-items:center;gap:.4rem;border:2px dashed var(--line);background:transparent;border-radius:14px;padding:.75rem 1.1rem;min-height:48px;cursor:pointer;color:var(--muted);font-weight:600}
.addbtn:hover{color:var(--ink);border-color:var(--muted)}
.add-row{width:100%;justify-content:center;border:0;border-top:1px dashed var(--line);border-radius:0}
.btnline{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.empty-state{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:2rem 1.2rem;text-align:center;color:var(--muted)}

/* Formulare & Panels */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:1.2rem;max-width:660px;margin-bottom:1rem;box-shadow:var(--shadow)}
.panel h2{font-size:1.3rem;margin-bottom:.4rem}
.panel p{margin:.3rem 0 .9rem}
label.f{display:block;margin:0 0 .85rem;font-weight:600}
label.f > span{display:block;margin-bottom:.3rem}
input[type=text],input[type=url],input[type=password],input[type=number],select,textarea{
  width:100%;background:var(--page);border:1px solid var(--line);border-radius:10px;padding:.65rem .75rem;min-height:46px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px}
.check{display:flex;align-items:center;gap:.55rem;font-weight:600;margin:0 0 .85rem;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:12px;padding:.65rem 1.1rem;min-height:46px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-weight:600;text-decoration:none}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.status{margin-top:.8rem;font-weight:600}
.status.ok{color:var(--ok)}.status.err{color:var(--danger)}
.hint{font-size:.88rem;color:var(--muted);font-weight:400;margin:.3rem 0 0}
fieldset{border:1px solid var(--line);border-radius:12px;padding:.75rem .85rem .2rem;margin:0 0 .9rem}
legend{font-weight:700;padding:0 .3rem}
.seg{display:flex;gap:.35rem;flex-wrap:wrap;margin:.1rem 0 .6rem}
.seg label{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:999px;padding:.35rem .8rem;cursor:pointer;font-weight:600;min-height:40px}
.seg input{accent-color:var(--primary)}
.slot-file,.slot-link,.newname{margin-bottom:.6rem}
.current{font-size:.9rem;color:var(--muted);margin:-.2rem 0 .5rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.checklist{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:.4rem .7rem;margin-bottom:.6rem}
.checklist label{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem 0;border-top:1px solid var(--line);font-weight:600}
.checklist label:first-child{border-top:0}
.checklist small{display:block;font-weight:400;color:var(--muted)}
.checklist input{width:20px;height:20px;margin-top:.15rem;accent-color:var(--primary)}

dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:min(600px,100vw);width:100%}
dialog::backdrop{background:rgba(10,14,20,.5)}
.sheet-form{background:var(--sheet);border-radius:22px;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom,0px));margin:0 .5rem;max-height:92vh;overflow:auto}
.sheet-form h3{font-size:1.35rem;margin:0 0 1rem}
@media (max-width:600px){dialog{margin:auto 0 0;max-width:100vw}.sheet-form{border-radius:22px 22px 0 0;margin:0}}
.sheet-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap;position:sticky;bottom:-1.2rem;background:var(--sheet);padding:.6rem 0 .2rem}
.sheet-actions .left{margin-right:auto}
.sheet-actions .btn{order:2}.sheet-actions .btn.primary{order:3}.sheet-actions .btn.left{order:1}

/* Zugang */
.lock{min-height:calc(100vh - 140px);display:grid;place-items:center;padding:1rem}
.lock-card{background:var(--sheet);border:1px solid var(--line);border-radius:26px;padding:1.6rem 1.4rem;width:min(380px,100%);text-align:center;box-shadow:var(--shadow)}
.lock-card svg.logo{width:64px;height:64px;margin:0 auto .6rem;display:block}
.lock-card h1{font-size:1.6rem}
.lock-card p{color:var(--muted);margin:.3rem 0 1rem}
.pins{display:flex;justify-content:center;gap:.6rem;margin:0 0 1rem}
.pins span{width:46px;height:56px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:1.6rem;font-weight:700}
.pins span.on{border-color:var(--primary)}
.pins.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.pad button{min-height:58px;border-radius:14px;border:1px solid var(--line);background:var(--page);font-size:1.4rem;font-weight:600;cursor:pointer}
.pad button:active{background:var(--soft)}
.lock-card .check{justify-content:center;margin:1rem 0 0;font-weight:500;color:var(--muted)}
.lock-tipp{margin:.9rem auto 0;max-width:380px;text-align:center;font-size:.9rem;color:var(--muted)}
.lock-tipp .pillbtn{min-height:0;padding:.1rem .55rem;pointer-events:none;vertical-align:middle;font-size:.85rem}
.lock-tipp .pillbtn svg{width:1em;height:1em}
.codeinput{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

/* Anzeige */
.viewer{position:fixed;inset:0;z-index:40;background:var(--page);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.viewer-bar{display:flex;align-items:center;gap:.4rem;padding:.45rem .6rem;border-bottom:1px solid var(--line);background:var(--sheet)}
.viewer-bar b{margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:.3rem}
.viewer-main{flex:1;display:flex;min-height:0}
.viewer-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;min-width:0}
/* QR-Code + Arbeitsauftrag neben dem Material (nur Lehrkraft, nichts wird gespeichert) */
.qr-aside{width:min(400px,38vw);flex:none;border-left:1px solid var(--line);background:var(--sheet);overflow:auto;padding:1.1rem;display:flex;flex-direction:column;gap:.8rem}
.qr-aside .qr-box{background:#fff;border-radius:12px;padding:.6rem}
.qr-aside .qr-box svg{width:100%;height:auto;display:block}
.qr-aside textarea{width:100%;min-height:7.5rem;font:inherit;font-size:clamp(1.25rem,2.2vw,1.9rem);font-weight:700;line-height:1.3;border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;background:var(--page);color:inherit;resize:vertical}
.qr-aside .qr-titel{font-size:1.05rem;font-weight:700;margin:0}
.qr-aside .qr-warn{background:var(--warn-soft,#FFF6D6);border-radius:10px;padding:.6rem .7rem;font-size:.92rem}
@media (max-width:700px){.viewer-main{flex-direction:column-reverse}.qr-aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:55%}}
.viewer:fullscreen .viewer-bar{opacity:.25;transition:opacity .2s}.viewer:fullscreen .viewer-bar:hover{opacity:1}
.viewer-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
.viewer-body img,.viewer-body video{max-width:100%;display:block;margin:1rem auto}
.pdf-pages{padding:.8rem;display:grid;gap:.8rem;justify-items:center;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
.pdf-page{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);width:100%;max-width:900px;position:relative}
.pdf-page canvas{width:100%;height:auto;display:block}
.file-card{max-width:440px;margin:3rem auto;text-align:center;padding:1.5rem;background:var(--sheet);border:1px solid var(--line);border-radius:18px}
.file-card .i{width:44px;height:44px;color:var(--tc,var(--primary))}

/* Laden & Meldungen */
.saving{position:fixed;left:1rem;bottom:1rem;z-index:55;display:none;gap:.5rem;align-items:center;background:var(--sheet);border-radius:999px;padding:.4rem .9rem;font-size:.85rem;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.saving.on{display:flex}
.saving .spin{width:14px;height:14px}
.busy{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(10,14,20,.35)}
.busy.on{display:grid}
.busy div{background:var(--sheet);border-radius:16px;padding:1.1rem 1.4rem;display:flex;gap:.8rem;align-items:center;font-weight:600;max-width:85vw}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.center-spin{display:grid;place-items:center;height:100%;min-height:200px}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);visibility:hidden;background:var(--ink);color:var(--sheet);border-radius:12px;padding:.75rem 1.1rem;z-index:70;transition:transform .25s;max-width:90vw;font-weight:600}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast-btn{margin-left:.8rem;border:0;background:transparent;color:inherit;font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:32px}
.korb-list{list-style:none;margin:.6rem 0 0;padding:0}
.korb-list li{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 0;border-top:1px solid var(--line)}
.korb-list small{display:block;color:var(--muted);font-size:.85rem}
footer{max-width:1040px;margin:0 auto;padding:0 1rem 2rem;display:flex;justify-content:flex-end}
footer a{display:inline-flex;align-items:center;gap:.35rem;color:var(--muted);text-decoration:none;font-size:.9rem;min-height:40px}
.reihe-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
/* Titelbild der Reihe */
.titelbild-wrap{margin:0 0 1.3rem;text-align:center}
.titelbild-btn{position:relative;display:inline-block;max-width:100%;padding:0;border:0;background:transparent;cursor:zoom-in;border-radius:16px;vertical-align:top}
/* erkennbar, aber nicht bildschirmfüllend: höchstens ca. ein Drittel der Höhe (iPad hoch ≈ 300 px, quer ≈ 250 px) */
.titelbild{display:block;max-width:100%;max-height:min(32vh,300px);width:auto;height:auto;margin:0 auto;border-radius:16px;box-shadow:var(--shadow);background:var(--soft)}
.titelbild-btn .zoom{position:absolute;right:.5rem;bottom:.5rem;display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .6rem;border-radius:999px;
  background:rgba(15,20,28,.62);color:#fff;font-size:.8rem;font-weight:600;pointer-events:none}
.titelbild-btn .zoom .i{width:1em;height:1em}
@media (max-width:560px){.titelbild{max-height:min(28vh,220px)}.titelbild-btn .zoom span{display:none}}
/* Titelbild mit verknüpfter Seite (z. B. Advance Organizer als HTML): Bild = Vorschau, Knopf öffnet die Seite */
.titelbild-box{position:relative;display:inline-block;max-width:100%;vertical-align:top}
.titelseite-btn{position:absolute;left:.5rem;bottom:.5rem;display:inline-flex;align-items:center;gap:.35rem;padding:.45rem .85rem;min-height:38px;border-radius:999px;
  border:0;background:var(--acc);color:#fff;font:inherit;font-size:.88rem;font-weight:700;text-decoration:none;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.titelseite-btn .i{width:1.05em;height:1.05em}
.titelseite-btn.solo{position:static;box-shadow:none;font-size:1rem;padding:.6rem 1.1rem;min-height:44px}
/* Material: Auge, ausgeblendet */
.mwrap{display:inline-flex;align-items:center;gap:.1rem;max-width:100%}
.mwrap .iconbtn{width:40px;height:40px}
.mwrap .iconbtn.vis-mini,.row-acts .vis-mini{width:34px;height:34px;opacity:.45}
.mwrap .iconbtn.vis-mini:hover,.row-acts .iconbtn:hover,.mwrap .iconbtn.vis-mini:focus-visible{opacity:1}
.row-acts{display:inline-flex;gap:.05rem;align-items:flex-start}
.row-acts .iconbtn{width:38px;height:38px;color:var(--muted)}
.editing .row-acts{display:none}
.row.aktuell{box-shadow:inset 4px 0 0 var(--acc);background:color-mix(in srgb, var(--acc) 6%, var(--sheet))}
.akt-badge{display:inline-block;margin-left:.45rem;padding:.05rem .45rem;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
  background:color-mix(in srgb, var(--acc) 14%, transparent);color:var(--acc);vertical-align:middle}
.chip.ziel,[data-m].ziel{outline:3px solid var(--acc);outline-offset:2px}
.auswahl-bar{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;
  background:var(--sheet);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:.45rem .55rem .45rem 1rem;max-width:calc(100vw - 1.5rem)}
.auswahl-bar b{margin-right:.4rem}
.auswahl-bar .pillbtn.danger{color:var(--danger)}
.chip.gewaehlt{outline:3px solid var(--acc);outline-offset:2px;background:color-mix(in srgb, var(--acc) 12%, var(--sheet))}
.auswahl [data-sort=m] > .mwrap > .chip{cursor:pointer}
.plan-box{margin:1.4rem 0 0;border:1.5px dashed color-mix(in srgb, var(--lk) 55%, transparent);border-radius:14px;padding:.7rem .9rem .9rem;background:color-mix(in srgb, var(--lk) 5%, transparent)}
.plan-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.plan-head .lbl{color:var(--lk);font-weight:700;font-size:.85rem}
.plan-body h4{margin:.7rem 0 .25rem;font-size:.95rem;color:var(--lk)}
.plan-body .fmt{margin:.2rem 0}
.plan-todo{display:flex;align-items:flex-start;gap:.55rem;padding:.25rem 0;cursor:pointer;min-height:34px}
.plan-todo input{width:20px;height:20px;margin:.12rem 0 0;accent-color:var(--lk);flex:none}
.plan-todo.fertig span{text-decoration:line-through;color:var(--muted)}
.popmenu{position:absolute;z-index:60;min-width:230px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:.35rem;display:grid}
.popmenu button{display:flex;align-items:center;gap:.6rem;padding:.65rem .75rem;border:0;background:transparent;border-radius:10px;font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:44px}
.popmenu button:hover,.popmenu button:focus-visible{background:var(--hover, rgba(0,0,0,.06))}
.chip.aus{opacity:.55;border-style:dashed}
.chip .aus-i{width:1em;height:1em;color:var(--muted)}
.lk-area.edit{margin-top:.6rem}
/* Speicher */
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:.3rem 0 .2rem}
.bar i{display:block;height:100%;background:var(--primary)}
.bar.warn i{background:var(--danger)}
.store-list{list-style:none;margin:.6rem 0 0;padding:0}
.store-list li{display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0;border-top:1px solid var(--line)}
.store-list li.sub{padding-left:1rem;color:var(--muted);font-size:.95rem}
.linkbtn{display:inline-flex;align-items:center;gap:.35rem;border:0;background:transparent;color:var(--muted);font-size:.88rem;cursor:pointer;min-height:40px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.fach-extern{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
/* Sammel-Upload */
.sync-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:1rem;padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))}
.sync-box{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:1rem;margin:0 auto 1rem;max-width:1200px;box-shadow:var(--shadow)}
.sync-box h3{font-size:1.2rem;margin-bottom:.15rem}
.sync-path{font-size:.85rem;color:var(--muted);word-break:break-all;margin-bottom:.7rem}
.sync-ziel{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 .8rem}
.sync-ziel input{margin-top:.35rem}
.tbl-wrap{overflow-x:auto;margin-top:.5rem;-webkit-overflow-scrolling:touch}
table.sync{width:100%;border-collapse:collapse;font-size:.93rem}
table.sync th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:700;padding:.35rem .4rem;border-bottom:1px solid var(--line);white-space:nowrap}
table.sync td{padding:.3rem .4rem;border-bottom:1px solid var(--line);vertical-align:middle}
table.sync select,table.sync input[type=text]{min-height:38px;padding:.3rem .5rem;font-size:.92rem;min-width:110px}
table.sync input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary)}
table.sync tr.off td:not(:first-child){opacity:.45}
/* Sammel-Upload als Fenster vor der Seite */
.viewer.sync-modal{background:rgba(15,20,28,.5);align-items:center;justify-content:center;padding:3vh 3vw}
.sync-panel{background:var(--page);width:min(1240px,100%);max-height:100%;min-height:0;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sync-panel .sync-body{min-height:0}
@media (max-width:700px){.viewer.sync-modal{padding:0}.sync-panel{border-radius:0;height:100%}}
table.sync .fname{font-size:.82rem;color:var(--muted);word-break:break-all;min-width:150px;max-width:260px}
.st{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:.12rem .55rem;white-space:nowrap;background:var(--soft);color:var(--muted)}
.st.neu{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st.geaendert{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.st.gesperrt{color:var(--danger)}
.drop-on{outline:3px dashed var(--primary) !important;outline-offset:-3px}
/* Hinweis-Banner */
.hinweis{display:flex;gap:.7rem;align-items:flex-start;background:#FFF6D3;color:#3A2E00;border:1px solid #F3C21B;border-radius:16px;padding:.85rem 1rem;margin:0 0 1.2rem;font-weight:600}
.hinweis .fmt b{font-weight:800}
.hinweis .i{color:#B58900;margin-top:.15rem}
.hinweis .spacer{flex:1}
.hinweis small{display:block;font-weight:400;color:#6B5A10}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hinweis{background:#3A3212;color:#FFE89A;border-color:#8A7414} :root:not([data-theme="light"]) .hinweis small{color:#E6D58C} }
.hinweis.alt{opacity:.55}
/* Checkliste „Ich kann …“ */
.checkbox{background:var(--sheet);border:1px solid var(--line);border-radius:18px;margin:0 0 1.2rem;box-shadow:var(--shadow)}
.checkbox > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.6rem;padding:.85rem 1rem;font-weight:700}
.checkbox > summary::-webkit-details-marker{display:none}
.checkbox > summary .count{margin-left:auto;font-weight:600;color:var(--muted);font-size:.92rem}
.checkbox > summary .i.chev{transition:transform .2s}
.checkbox[open] > summary .i.chev{transform:rotate(90deg)}
.checkbox ul{list-style:none;margin:0;padding:0 .6rem .6rem}
.checkbox li.kopf{font-family:var(--serif);font-weight:700;padding:.7rem .5rem .2rem;color:var(--acc)}
.ck{display:flex;width:100%;align-items:center;gap:.7rem;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:.6rem .5rem;min-height:48px;cursor:pointer}
.ck .dot{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.ck.unsicher .dot{border-color:#E0A800;background:#FFF1B8;color:#6B5200}
.ck.sicher .dot{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--sheet));color:var(--ok)}
.check-legende{font-size:.85rem;color:var(--muted);padding:0 1.1rem .8rem}
/* Freischalten ab Datum */
.chip .ab, .aus-badge.ab{font-size:.72rem;font-weight:700;color:var(--muted);white-space:nowrap}
/* Suche */
.such-feld{width:100%;font-size:1.15rem;min-height:52px;padding:.7rem 1rem;border-radius:14px;border:1px solid var(--line);background:var(--sheet)}
.treffer{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.6rem}
.treffer li{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:.75rem 1rem}
.treffer .pfad{font-size:.85rem;color:var(--muted);margin-bottom:.15rem}
.treffer a.ziel{font-weight:700;text-decoration:none;color:var(--acc,var(--primary))}
.treffer .chips{margin-top:.45rem}
mark{background:#FFE58A;color:inherit;border-radius:3px;padding:0 .1em}
/* Ausgeblendete Stunden */
.row.aus{background:repeating-linear-gradient(-45deg,transparent 0 10px,color-mix(in srgb,var(--line) 35%,transparent) 10px 20px)}
.row.aus .row-title,.row.aus .row-main{opacity:.6}
.aus-badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.78rem;font-weight:700;color:var(--muted);margin-top:.2rem}
.aus-badge .i{width:1em;height:1em}
/* Kursansicht */
.kurs footer,.kurs .admin-only{display:none !important}
.kurs .brand{pointer-events:none}
.kurs-foot{text-align:center;margin-top:2.2rem}
/* Parallelkurse */
.kursbar{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;margin:0 0 1.1rem;padding:.7rem .8rem;border:1px solid var(--line);border-radius:16px;background:var(--sheet)}
.kursbar .lbl{display:inline-flex;align-items:center;gap:.35rem;font-weight:700;font-size:.9rem;color:var(--muted);margin-right:.2rem}
.kchip{display:inline-flex;align-items:center;gap:.3rem;min-height:42px;padding:.35rem .95rem;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer}
.kchip.on{background:var(--acc);border-color:var(--acc);color:var(--sheet)}
.kchip.add{font-weight:600;color:var(--muted);border-style:dashed}
.kurs-hint{flex-basis:100%;margin:.2rem 0 0;font-size:.85rem;color:var(--muted)}
.kurs .pill{cursor:default;-webkit-user-select:none;user-select:none}
/* Teilen */
.qr-box{display:grid;place-items:center;margin:.2rem 0 .9rem}
.qr-box svg{width:min(240px,64vw);height:auto;background:#fff;padding:8px;border-radius:14px;border:1px solid var(--line)}
.linkbox{word-break:break-all;background:var(--page);border:1px solid var(--line);border-radius:10px;padding:.6rem .75rem;font-size:.9rem;margin-bottom:.6rem}
.import-list{margin:.4rem 0 .8rem;padding-left:1.2rem}
.import-list li{margin:.2rem 0}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2s}.toast,.jg,.lk-toggle .i{transition:none}.pins.err{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#logo"/></svg><span id="brand-title">Unterrichtsmaterial</span></a>
    <button class="pillbtn add admin-only" id="add-material" hidden></button>
    <button class="pillbtn admin-only" id="edit-toggle" hidden></button>
    <button class="pillbtn" id="kurs-exit" hidden></button>
    <a class="iconbtn" id="search-btn" href="#/suche" aria-label="Suche" title="Suche" hidden></a>
    <button class="iconbtn" id="reload" aria-label="Neu laden" title="Neu laden"></button>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<footer><a href="#/einstellungen" id="settings-link"></a></footer>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22305A"/><stop offset="1" stop-color="#2F5FB3"/></linearGradient>
    <symbol id="logo" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="24" fill="url(#lg-bg)"/>
      <rect x="66" y="22" width="16" height="13" rx="4" fill="#F5B83D"/>
      <rect x="66" y="40" width="16" height="13" rx="4" fill="#3CC4A0"/>
      <rect x="66" y="58" width="16" height="13" rx="4" fill="#7FB0FF"/>
      <rect x="20" y="16" width="54" height="68" rx="8" fill="#FFFFFF"/>
      <rect x="20" y="16" width="10" height="68" rx="5" fill="#DCE6F7"/>
      <rect x="37" y="30" width="27" height="5" rx="2.5" fill="#2F5FB3"/>
      <rect x="37" y="42" width="22" height="4" rx="2" fill="#B9C6DC"/>
      <rect x="37" y="51" width="26" height="4" rx="2" fill="#B9C6DC"/>
      <rect x="37" y="60" width="18" height="4" rx="2" fill="#B9C6DC"/>
    </symbol>
  </defs>
</svg>

<dialog id="sheet"></dialog>
<div class="saving" id="saving" role="status"><span class="spin"></span>Speichert …</div>
<div class="busy" id="busy"><div><span class="spin"></span><span id="busy-text">Bitte warten …</span></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* =====================================================================
   Grundlagen
   ===================================================================== */
var CFG_KEY = 'um-github', KEK_KEY = 'um-zugang', LK_KEY = 'um-lk-zu', KURS_KEY = 'um-kurs';
var DATA_PATH = 'data/inhalt.enc', ACCESS_PATH = 'data/zugang.json';
var MAX_MB = 50, WARN_MB = 15, ITER = 250000;
var LIMIT_MB = 1024, WARN_TOTAL_MB = 800; // GitHub Pages: höchstens 1 GB pro Seite
var VIDEO_EXT = ['mp4','mov','m4v','avi','webm','mkv','wmv'];
var MAGIC = [85, 77, 67, 49]; // "UMC1"

function wireLock(){

}

/* Materialien einer Reihe in Anzeige-Reihenfolge (was in dieser Ansicht sichtbar ist) */
function reiheFolge(c){
